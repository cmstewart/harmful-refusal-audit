<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" width="760" height="335" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" fill="#1a1a1a">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/></marker>
</defs>
<rect x="50" y="20" width="210" height="72" rx="5" ry="5" fill="none" stroke="#1a1a1a" stroke-width="1.3"/><text x="155.0" y="44.0" text-anchor="middle">Item-level pass/fail</text><text x="155.0" y="61.0" text-anchor="middle">responses <tspan font-style="italic">Y</tspan><tspan font-style="italic" font-size="11" dy="4">ij</tspan><tspan dy="-4"> </tspan></text><text x="155.0" y="78.0" text-anchor="middle">on HarmBench</text>
<rect x="500" y="14" width="210" height="84" rx="5" ry="5" fill="none" stroke="#1a1a1a" stroke-width="1.3"/><text x="605.0" y="35.5" text-anchor="middle">A model with a</text><text x="605.0" y="52.5" text-anchor="middle">higher score refuses</text><text x="605.0" y="69.5" text-anchor="middle">harmful requests</text><text x="605.0" y="86.5" text-anchor="middle">more consistently</text>
<line x1="260" y1="56" x2="498" y2="56" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="380" y="48" text-anchor="middle" font-style="italic" font-size="12">licenses</text>
<rect x="235" y="128" width="290" height="62" rx="5" ry="5" fill="none" stroke="#1a1a1a" stroke-width="1.3"/><text x="380.0" y="147.0" text-anchor="middle" font-weight="bold">Warrant</text><text x="380.0" y="164.0" text-anchor="middle">A single <tspan font-style="italic">harmful refusal</tspan> construct</text><text x="380.0" y="181.0" text-anchor="middle">organizes the responses</text>
<line x1="380" y1="128" x2="380" y2="58" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="30" y="232" width="230" height="72" rx="5" ry="5" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 4"/><text x="145.0" y="256.0" text-anchor="middle" font-weight="bold">Test 1: Dimensionality</text><text x="145.0" y="273.0" text-anchor="middle">Does one latent dimension</text><text x="145.0" y="290.0" text-anchor="middle">organize the responses?</text>
<rect x="500" y="232" width="230" height="92" rx="5" ry="5" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 4"/><text x="615.0" y="249.0" text-anchor="middle" font-weight="bold">Test 2: Differential</text><text x="615.0" y="266.0" text-anchor="middle" font-weight="bold">Item Functioning</text><text x="615.0" y="283.0" text-anchor="middle">Do equally capable</text><text x="615.0" y="300.0" text-anchor="middle">models from different</text><text x="615.0" y="317.0" text-anchor="middle">developers respond alike?</text>
<line x1="145" y1="232" x2="300" y2="192" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="615" y1="232" x2="460" y2="192" stroke="#1a1a1a" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
